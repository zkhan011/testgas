spring:
  application:
    name: dpw-integration-rest
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false # Do not probe the inactive database pool.
gasws:
  database: promis # promis or gold; selection is fixed for the process lifetime.
  query-timeout-seconds: 30
  oracle:
    package-name: GAS_WEB_SERVICE_INTERFACE
    object-type: CAMCO_CONTR_OBJ
    array-type: TBL_CAMCO_CONTR_OBJ
  security:
    username: ${GASWS_API_USERNAME:gate-api}
    password-hash: ${GASWS_API_PASSWORD_HASH:}
  datasource:
    promis:
      url: ${GASWS_PROMIS_URL:jdbc:oracle:thin:@//localhost:1521/PROMIS}
      username: ${GASWS_PROMIS_USERNAME:}
      password: ${GASWS_PROMIS_PASSWORD:}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 0
        connection-timeout: 5000
        initialization-fail-timeout: -1
    gold:
      url: ${GASWS_GOLD_URL:jdbc:oracle:thin:@//localhost:1521/GOLD}
      username: ${GASWS_GOLD_USERNAME:}
      password: ${GASWS_GOLD_PASSWORD:}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 0
        connection-timeout: 5000
        initialization-fail-timeout: -1

gate:
  security:
    api-key: "${GATE_API_KEY:}"
    admin-key: "${GATE_ADMIN_KEY:}"
  inspection:
    message: "MUST EXIT THROUGH GATE 12. NOT ALLOWED TO EXIT THROUGH GATE 3 OR GATE 7."
    flag: "1"
  databases:
    ctms-ja:
      url: "jdbc:oracle:thin:@//CHANGE_ME:1521/CHANGE_ME"
      username: "CHANGE_ME"
      password: "CHANGE_ME"
      maximum-pool-size: 5
    ctms-pr:
