oracle.home=@ORACLE_HOME@

# Console is set to be a ConsoleAppender.
log4j.rootLogger=INFO,DEBUG, file ,Console

# SqlMap logging configuration
log4j.logger.com.ibatis=INFO,DEBUG
log4j.logger.java.sql=INFO,DEBUG
log4j.logger.org.springframework=INFO,DEBUG
log4j.logger.com.dpw=INFO,DEBUG

log4j.appender.DEBUG=org.apache.log4j.ConsoleAppender
log4j.appender.DEBUG.layout=org.apache.log4j.PatternLayout
log4j.appender.DEBUG.layout.ConversionPattern=[%-5p][%d{yyyy-MM-dd HH:mm:ss}] %m%n
#log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.file=org.apache.log4j.DailyRollingFileAppender
log4j.appender.file.File=${oracle.home}/opmn/logs/gasws/gasws.log
log4j.appender.file.datePattern = '.'yyyy-MM-dd
log4j.appender.file.MaxFileSize=20MB
log4j.appender.file.MaxBackupIndex=10
#log4j.appender.CONSOLE.layout=org.apache.log4j.SimpleLayout
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=[%-5p][%d{yyyy-MM-dd HH:mm:ss}] (%13F:%L) %3x - %m%n
